services:
  postgres:
    ports: ['127.0.0.1:55432:5432']
    volumes: ['./postgres/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro']
  minio:
    ports: ['127.0.0.1:59000:9000']
  api:
    environment:
      NODE_ENV: development
  storage-init:
    environment:
      INIT_TEST_BUCKET: 'true'
networks:
  data:
    internal: false
