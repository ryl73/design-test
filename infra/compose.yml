name: design-qa-stage-a
services:
  web:
    build: {context: .., dockerfile: infra/Dockerfile.web}
    ports: ['127.0.0.1:58080:80']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
